<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte Musicale du Monde</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0e1a26;--surface:#152030;--surface2:#1c2d40;--border:#253a52;--text:#e4edf8;--muted:#5e80a0;--accent:#38a0ff;--accent-dim:#132840;--pin-r:#ff4466;--pin-b:#38a0ff;--shadow:0 4px 20px rgba(0,0,0,.45);--shadow-lg:0 16px 56px rgba(0,0,0,.65)}
html,body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:100;gap:12px}
.logo{font-family:'Playfair Display',serif;font-size:1.05rem;white-space:nowrap;display:flex;align-items:center;gap:7px}
.header-mid{display:flex;align-items:center;gap:12px;flex:1;justify-content:center;max-width:520px;margin:0 auto}
.search-wrap{position:relative;width:100%;max-width:280px}
.search-wrap input{width:100%;font-family:'Outfit',sans-serif;font-size:.82rem;padding:6px 12px 6px 32px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.82rem;pointer-events:none}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface2);border:1px solid var(--border);border-radius:10px;z-index:400;overflow:hidden;box-shadow:var(--shadow);display:none;max-height:240px;overflow-y:auto}
.search-results.show{display:block}
.search-item{padding:8px 13px;font-size:.82rem;cursor:pointer;transition:background .12s;display:flex;align-items:center;justify-content:space-between;gap:8px}
.search-item:hover{background:var(--border)}
.si-pin{font-size:.7rem;color:var(--accent);background:var(--accent-dim);padding:1px 6px;border-radius:4px;white-space:nowrap}
.legend{display:flex;align-items:center;gap:14px;font-size:.7rem;color:var(--muted);white-space:nowrap}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.legend-item{display:flex;align-items:center;gap:5px}
.header-right{display:flex;align-items:center;gap:9px;white-space:nowrap}
.user-badge{display:flex;align-items:center;gap:6px;background:var(--accent-dim);border:1px solid #1a4870;border-radius:20px;padding:5px 12px;font-size:.78rem;font-weight:500;color:var(--accent)}
.online-dot{width:6px;height:6px;background:#22c55e;border-radius:50%}
.btn{font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:500;padding:5px 13px;border-radius:8px;border:none;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#5ab0ff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:rgba(255,68,102,.12);color:var(--pin-r);border:1px solid rgba(255,68,102,.28)}.btn-danger:hover{background:rgba(255,68,102,.22)}
.btn-sm{padding:3px 9px;font-size:.72rem}
#map-wrapper{flex:1;position:relative;overflow:hidden;cursor:grab}
#map-wrapper:active{cursor:grabbing}
#ocean-canvas{position:absolute;inset:0;pointer-events:none;z-index:0}
#map-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.sphere{fill:transparent}.graticule{fill:none;stroke:rgba(255,255,255,.04);stroke-width:.5px}.borders{fill:none;stroke:rgba(0,0,0,.55);stroke-width:.3px}
.country{stroke:rgba(0,0,0,.35);stroke-width:.3px;cursor:pointer;transition:filter .18s}.country:hover{filter:brightness(1.3)}
.country.highlighted{stroke:#fff!important;stroke-width:1.5px!important;filter:brightness(1.6)!important}
.country.has-pins{stroke:rgba(255,255,160,.55);stroke-width:.7px}
.pin-group{cursor:pointer}.pin-group:hover .pin-c{filter:brightness(1.4) drop-shadow(0 0 5px currentColor)}.pin-c{transition:filter .15s}
.pin-lbl{font-family:'Outfit',sans-serif;font-size:7px;font-weight:700;fill:white;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map-controls{position:absolute;bottom:26px;right:22px;display:flex;flex-direction:column;gap:4px;z-index:50}
.ctrl-btn{width:36px;height:36px;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:all .15s;font-family:'Outfit',sans-serif}
.ctrl-btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent)}
.ctrl-reset{font-size:.55rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.map-stats{position:absolute;bottom:26px;left:22px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;font-size:.72rem;color:var(--muted);box-shadow:var(--shadow)}
.map-stats strong{color:var(--text);font-size:.95rem;font-weight:600}
.hint-bar{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:5px 15px;font-size:.72rem;color:var(--muted);pointer-events:none;box-shadow:var(--shadow);z-index:50;white-space:nowrap}
#loader{position:absolute;inset:0;background:#0a1520;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:14px;transition:opacity .5s}
#loader.done{opacity:0;pointer-events:none}
.spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{color:var(--muted);font-size:.82rem}
#tooltip{position:fixed;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:.75rem;color:var(--text);pointer-events:none;z-index:600;display:none;white-space:nowrap;box-shadow:var(--shadow)}
.tt-name{font-weight:600}.tt-count{color:var(--accent);font-size:.68rem;margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:700;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);animation:fadeIn .2s ease}
.overlay.hidden{display:none}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px;width:100%;max-width:420px;box-shadow:var(--shadow-lg);animation:slideUp .2s ease}
.modal-wide{max-width:600px}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px;gap:10px}
.modal h2{font-family:'Playfair Display',serif;font-size:1.3rem;line-height:1.3}
.mclose{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--muted);width:28px;height:28px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.mclose:hover{color:var(--text);background:var(--border)}
.msubtitle{color:var(--muted);font-size:.8rem;margin-bottom:16px}
.fgroup{margin-bottom:12px}
.fgroup label{display:block;font-size:.68rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em}
.fgroup input{width:100%;font-family:'Outfit',sans-serif;font-size:.88rem;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
.fgroup input:focus{border-color:var(--accent)}
.fgroup input::placeholder{color:var(--muted)}
.mfooter{display:flex;gap:7px;margin-top:18px;justify-content:flex-end}
.errmsg{color:var(--pin-r);font-size:.74rem;margin-top:4px;display:none}.errmsg.show{display:block}
.mini-wrap{width:100%;height:120px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#08141e;margin-bottom:14px}
#mini-svg{width:100%;height:100%}
.pin-list{display:flex;flex-direction:column;gap:9px;max-height:280px;overflow-y:auto;padding-right:3px}
.pin-list::-webkit-scrollbar{width:4px}
.pin-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.pin-card{background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:12px}
.pin-card.own{border-color:#1a4870;background:var(--accent-dim)}
.pin-card.pending{border-color:#c47800;background:rgba(196,120,0,.1)}
.pmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pauthor{font-size:.74rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
.pauthor.me{color:var(--accent)}
.tag-me{background:var(--accent-dim);color:var(--accent);border:1px solid #1a4870;border-radius:3px;padding:1px 5px;font-size:.64rem;font-weight:700}
.tag-pending{background:rgba(196,120,0,.15);color:#f0a030;border:1px solid rgba(196,120,0,.3);border-radius:3px;padding:1px 5px;font-size:.64rem;font-weight:700}
.pdate{font-size:.67rem;color:var(--muted)}
.ptitle{font-weight:600;font-size:.87rem;margin-bottom:8px}
.yt-frame{width:100%;aspect-ratio:16/9;border-radius:8px;border:none;background:#000}
.pin-img{width:100%;border-radius:8px;margin-top:8px;object-fit:cover;max-height:200px;background:#111}
.add-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.add-section h3{font-size:.84rem;font-weight:600;margin-bottom:10px}
.empty-state{text-align:center;padding:20px 0;color:var(--muted);font-size:.82rem}
.empty-icon{font-size:1.8rem;margin-bottom:7px}
.login-hero{text-align:center;font-size:2.5rem;margin-bottom:12px}
#notif{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 17px;border-radius:20px;font-size:.78rem;z-index:800;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;box-shadow:var(--shadow)}
#notif.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* INSTANCE badge */
.instance-badge{background:rgba(255,200,50,.1);border:1px solid rgba(255,200,50,.3);color:#f0c830;border-radius:6px;padding:2px 9px;font-size:.72rem;font-weight:600;white-space:nowrap}

</head>
<body>
<header>
  <div class="logo">🎵 <span id="map-title">Carte Musicale</span></div>
  <div class="header-mid">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Rechercher un pays…" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="legend">
      <div class="legend-item"><span class="ldot" style="background:var(--pin-r)"></span>En attente</div>
      <div class="legend-item"><span class="ldot" style="background:#22c55e"></span>Validé</div>
    </div>
  </div>
  <div class="header-right">
    <div id="user-badge" class="user-badge" style="display:none"><div class="online-dot"></div><span id="badge-name"></span></div>
    <button class="btn btn-ghost" id="logout-btn" style="display:none" onclick="logout()">Déconnexion</button>
    <button class="btn btn-primary" id="login-btn" onclick="openLogin()">Se connecter</button>
  </div>
</header>
<div id="map-wrapper">
  <div id="loader"><div class="spinner"></div><div class="loader-text" id="loader-text">Chargement…</div></div>
  <canvas id="ocean-canvas"></canvas>
  <svg id="map-svg"></svg>
  <div class="hint-bar">🌍 Clic sur un pays · Molette pour zoomer · Glisser pour naviguer</div>
  <div class="map-controls">
    <button class="ctrl-btn" onclick="zoomIn()">+</button>
    <button class="ctrl-btn ctrl-reset" onclick="zoomReset()">↺</button>
    <button class="ctrl-btn" onclick="zoomOut()">−</button>
  </div>
  <div class="map-stats"><strong id="pin-count">0</strong> contribution(s)</div>
</div>
<div id="tooltip"><div class="tt-name" id="tt-name"></div><div class="tt-count" id="tt-count"></div></div>

<!-- LOGIN -->
<div class="overlay hidden" id="login-overlay">
  <div class="modal">
    <div class="login-hero">🎶</div>
    <div class="mhead"><h2>Rejoindre la carte</h2><button class="mclose" onclick="closeLogin()">✕</button></div>
    <p class="msubtitle">Choisis ton prénom pour contribuer.</p>
    <div class="fgroup">
      <label>Ton prénom / pseudo</label>
      <input type="text" id="pseudo-input" placeholder="ex : Amélie, Lucas…" maxlength="22" autocomplete="off">
      <div class="errmsg" id="pseudo-error"></div>
    </div>
    <div class="mfooter">
      <button class="btn btn-ghost" onclick="closeLogin()">Annuler</button>
      <button class="btn btn-primary" onclick="doLogin()">C'est parti !</button>
    </div>
  </div>
</div>

<!-- COUNTRY MODAL -->
<div class="overlay hidden" id="country-overlay">
  <div class="modal modal-wide">
    <div class="mhead"><h2 id="country-title"></h2><button class="mclose" onclick="closeCountry()">✕</button></div>
    <p class="msubtitle" id="country-subtitle"></p>
    <div class="mini-wrap"><svg id="mini-svg"></svg></div>
    <div class="pin-list" id="pin-list"></div>
    <div class="add-section" id="add-section" style="display:none">
      <h3>➕ Ajouter une contribution</h3>
      <div class="fgroup">
        <label>Titre / description</label>
        <input type="text" id="pin-title-input" placeholder="ex : Bossa Nova, Djembé, K-pop…" maxlength="65">
      </div>
      <div class="fgroup">
        <label>🎵 Lien YouTube <span style="color:var(--muted);font-weight:400;text-transform:none">(optionnel)</span></label>
        <input type="text" id="pin-yt-input" placeholder="https://www.youtube.com/watch?v=…">
      </div>
      <div class="fgroup">
        <label>🎸 Image instrument <span style="color:var(--muted);font-weight:400;text-transform:none">(URL image, optionnel)</span></label>
        <input type="text" id="pin-img-input" placeholder="https://… lien vers une image">
      </div>
      <div class="errmsg" id="pin-error"></div>
    </div>
    <div class="mfooter">
      <button class="btn btn-ghost" onclick="closeCountry()">Fermer</button>
      <button class="btn btn-ghost" id="toggle-add-btn" onclick="toggleAdd()" style="">+ Ajouter une musique</button>
      <button class="btn btn-primary" id="save-btn" onclick="savePin()" style="display:none">Enregistrer</button>
    </div>
  </div>
</div>

<div id="notif"></div>

function getName(id){return(COUNTRY_DATA[id]||COUNTRY_DATA[+id]||COUNTRY_DATA[parseInt(id,10)]||['',''])[0]}

// ═══════════════════════════════════════
// FIREBASE DATA — realtime sync
// ═══════════════════════════════════════
let allPins = {}; // { countryId: { pinKey: {author,title,yt,img,date,status} } }

dbRef.on('value', snap => {
  const raw = snap.val() || {};
  // Normalize keys: remove leading zeros ("076" → "76", "012" → "12")
  allPins = {};
  Object.entries(raw).forEach(([k,v]) => {
    const nk = String(parseInt(k, 10));
    allPins[nk] = v;
  });
  refreshPins();
  if(currentCountry) renderPins();
  updateSearch();
});

function getPinsForCountry(id) {
  const raw = allPins[String(id)] || {};
  return Object.entries(raw).map(([k,v])=>({...v, _key:k}));
}
function getApprovedPins(id) {
  return getPinsForCountry(id).filter(p=>p.status!=='pending');
}

let currentUser = sessionStorage.getItem('cm_user') || null;
let currentCountry = null;
let addOpen = false;
let allFeatures = [];

// AUTH
// ═══════════════════════════════════════
function openLogin(){document.getElementById('login-overlay').classList.remove('hidden');setTimeout(()=>document.getElementById('pseudo-input').focus(),80)}
function closeLogin(){document.getElementById('login-overlay').classList.add('hidden');document.getElementById('pseudo-error').classList.remove('show');document.getElementById('pseudo-input').value=''}
function doLogin(){
  const v=document.getElementById('pseudo-input').value.trim();
  const err=document.getElementById('pseudo-error');
  if(!v||v.length<2){err.textContent='Prénom trop court.';err.classList.add('show');return}
  currentUser=v;sessionStorage.setItem('cm_user',v);
  closeLogin();updateHeaderUI();refreshPins();
  showNotif(`Bienvenue ${v} ! 🎵`);
}
function logout(){currentUser=null;sessionStorage.removeItem('cm_user');updateHeaderUI();refreshPins()}
function updateHeaderUI(){
  document.getElementById('user-badge').style.display=currentUser?'':'none';
  document.getElementById('badge-name').textContent=currentUser||'';
  document.getElementById('login-btn').style.display=currentUser?'none':'';
  document.getElementById('logout-btn').style.display=currentUser?'':'none';
}

// ═══════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════
const searchInput=document.getElementById('search-input');
const searchResultsEl=document.getElementById('search-results');
function updateSearch(){
  const q=searchInput.value.trim().toLowerCase();
  if(q.length<2){searchResultsEl.classList.remove('show');return}
  const hits=Object.entries(COUNTRY_DATA).filter(([,v])=>v[0].toLowerCase().includes(q)).slice(0,9);
  if(!hits.length){searchResultsEl.classList.remove('show');return}
  searchResultsEl.innerHTML=hits.map(([id,v])=>{
    const n=getApprovedPins(id).length;
    return `<div class="search-item" onclick="selectCountry(${id})"><span>${v[0]}</span>${n?`<span class="si-pin">🎵 ${n}</span>`:''}</div>`;
  }).join('');
  searchResultsEl.classList.add('show');
}
searchInput.addEventListener('input',updateSearch);
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Escape'){searchResultsEl.classList.remove('show');searchInput.blur()}
  if(e.key==='Enter'){const q=searchInput.value.trim().toLowerCase();const hit=Object.entries(COUNTRY_DATA).find(([,v])=>v[0].toLowerCase()===q);if(hit)selectCountry(+hit[0])}
});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))searchResultsEl.classList.remove('show')});

function selectCountry(id){
  searchResultsEl.classList.remove('show');searchInput.value='';
  const feat=allFeatures.find(f=>+f.id===+id);
  if(!feat)return;
  gCountries.selectAll('path.country').classed('highlighted',d=>+d.id===+id);
  const[cx,cy]=pathFn.centroid(feat);
  if(!isFinite(cx)||!isFinite(cy))return;
  const W=document.getElementById('map-wrapper').clientWidth;
  const H=document.getElementById('map-wrapper').clientHeight;
  svgSel.transition().duration(700).call(zoomBehavior.transform,d3.zoomIdentity.translate(W/2-4*cx,H/2-4*cy).scale(4));
  setTimeout(()=>{openCountry(id,getName(id));setTimeout(()=>gCountries.selectAll('path.country').classed('highlighted',false),1200)},750);
}

function openCountry(id,name){
  id=String(parseInt(String(id),10)); // normalize "076"→"76"
  currentCountry={id,name};addOpen=false;
  document.getElementById('country-title').textContent=name;
  document.getElementById('add-section').style.display='none';
  document.getElementById('pin-title-input').value='';
  document.getElementById('pin-yt-input').value='';
  document.getElementById('pin-img-input').value='';
  document.getElementById('pin-error').classList.remove('show');
  document.getElementById('toggle-add-btn').textContent='+ Ajouter une musique';
  document.getElementById('save-btn').style.display='none';
  renderMiniMap(id);
  renderPins();
  document.getElementById('country-overlay').classList.remove('hidden');
}
function closeCountry(){document.getElementById('country-overlay').classList.add('hidden');currentCountry=null}

function renderMiniMap(targetId){
  const miniSvg=d3.select('#mini-svg');miniSvg.selectAll('*').remove();
  if(!allFeatures.length)return;
  const node=document.getElementById('mini-svg');
  const W=node.clientWidth||560,H=node.clientHeight||120;
  const p=d3.geoNaturalEarth1().scale(W/6.3).translate([W/2,H/2]);
  const pFn=d3.geoPath().projection(p);
  miniSvg.append('path').datum({type:'Sphere'}).attr('d',pFn).attr('fill','#08141e');
  miniSvg.selectAll('path.mc').data(allFeatures).join('path').attr('class','mc')
    .attr('d',pFn)
    .attr('fill',d=>+d.id===+targetId?'#b03030':'#1e3448')
    .attr('stroke',d=>+d.id===+targetId?'#ff8866':'rgba(0,0,0,.25)')
    .attr('stroke-width',d=>+d.id===+targetId?.8:.2);
  const feat=allFeatures.find(f=>+f.id===+targetId);
  if(feat){const[cx,cy]=pFn.centroid(feat);if(isFinite(cx)&&isFinite(cy))miniSvg.append('circle').attr('cx',cx).attr('cy',cy).attr('r',4).attr('fill','#ff4466').attr('stroke','#fff').attr('stroke-width',.8)}
}

function renderPins(){
  if(!currentCountry)return;
  const pins=getPinsForCountry(currentCountry.id);
  const approved=pins.filter(p=>p.status!=='pending');
  const pending=pins.filter(p=>p.status==='pending');
  const myPending=pending.filter(p=>p.author===currentUser);
  const visible=[...approved,...myPending];
  document.getElementById('country-subtitle').textContent=
    approved.length===0?'Aucune musique validée pour ce pays.':
    `${approved.length} musique${approved.length>1?'s':''} validée${approved.length>1?'s':''} par le prof`;
  const list=document.getElementById('pin-list');
  if(!visible.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-icon">🎼</div>Sois le premier à proposer une musique ici !</div>`;
    return;
  }
  list.innerHTML=visible.map(p=>{
    const own=currentUser&&p.author===currentUser;
    const isPending=p.status==='pending';
    const ytId=getYTId(p.yt);
    return `<div class="pin-card${own?' own':''}${isPending?' pending':''}">
      <div class="pmeta">
        <span class="pauthor${own?' me':''}">${esc(p.author)}${own?'<span class="tag-me">moi</span>':''}${isPending?'<span class="tag-pending">⏳ en attente</span>':''}</span>
        <span class="pdate">${p.date}</span>
      </div>
      <div class="ptitle">${esc(p.title)}</div>
      ${ytId?`<iframe class="yt-frame" src="https://www.youtube.com/embed/${ytId}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe>`:''}
      ${p.img?`<img src="${esc(p.img)}" alt="instrument" style="width:100%;border-radius:8px;margin-top:8px;object-fit:cover;max-height:200px;background:#000" onerror="this.style.display='none'">`:''}
      ${own?`<div style="margin-top:8px"><button class="btn btn-danger btn-sm" onclick="deletePin('${p._key}')">🗑 Supprimer</button></div>`:''}
    </div>`;
  }).join('');
}

function toggleAdd(){
  if(!currentUser){openLogin();return}
  addOpen=!addOpen;
  document.getElementById('add-section').style.display=addOpen?'':'none';
  document.getElementById('toggle-add-btn').textContent=addOpen?'✕ Annuler':'+ Ajouter une musique';
  document.getElementById('save-btn').style.display=addOpen?'':'none';
}

function savePin(){
  const title=document.getElementById('pin-title-input').value.trim();
  const yt=document.getElementById('pin-yt-input').value.trim();
  const img=document.getElementById('pin-img-input').value.trim();
  const err=document.getElementById('pin-error');
  if(!title){err.textContent='Donne un titre.';err.classList.add('show');return}
  if(yt&&!getYTId(yt)){err.textContent='Lien YouTube invalide.';err.classList.add('show');return}
  if(!yt&&!img){err.textContent='Ajoute un lien YouTube ou une image.';err.classList.add('show');return}
  err.classList.remove('show');
  const pin={author:currentUser,title,yt:yt||'',img:img||'',date:new Date().toLocaleDateString('fr-FR'),status:'pending'};
  dbRef.child(currentCountry.id).push(pin);
  toggleAdd();
  showNotif('Proposition envoyée ! Le prof va valider 🎶');
}

function deletePin(key){
  if(!confirm('Supprimer ?'))return;
  dbRef.child(currentCountry.id+'/'+key).remove();
  showNotif('Supprimé.');
}

function getYTId(url){if(!url)return null;const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([A-Za-z0-9_-]{11})[^A-Za-z0-9_-]?/);return m?m[1]:null}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function showNotif(msg){const el=document.getElementById('notif');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
function showTT(e,name,count){
  document.getElementById('tt-name').textContent=name;
  document.getElementById('tt-count').textContent=count?`🎵 ${count} musique${count>1?'s':''}`:'' ;
  const tt=document.getElementById('tooltip');tt.style.display='block';tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-8)+'px';
}
function moveTT(e){const tt=document.getElementById('tooltip');tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-8)+'px'}
function hideTT(){document.getElementById('tooltip').style.display='none'}

// OCEAN
// ═══════════════════════════════════════
function initOcean(){
  const canvas=document.getElementById('ocean-canvas');
  const wrapper=document.getElementById('map-wrapper');
  canvas.width=wrapper.clientWidth;canvas.height=wrapper.clientHeight;
  const ctx=canvas.getContext('2d');let t=0;
  function draw(){
    const W=canvas.width,H=canvas.height;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a4a7a');g.addColorStop(.4,'#1e5a8a');g.addColorStop(1,'#163d68');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    [{n:6,amp:3.5,freq:.006,speed:.018,alpha:.12,lw:1.2,hue:195},{n:8,amp:2.5,freq:.009,speed:.025,alpha:.09,lw:.9,hue:200},{n:10,amp:1.8,freq:.013,speed:.032,alpha:.07,lw:.7,hue:205},{n:5,amp:5,freq:.004,speed:.010,alpha:.06,lw:1.5,hue:190}].forEach(l=>{
      for(let i=0;i<l.n;i++){
        const y0=H*(i+.5)/l.n,amp=l.amp,ph=t*l.speed+i*(Math.PI*2/l.n);
        ctx.beginPath();ctx.moveTo(0,y0);
        for(let x=0;x<=W;x+=3)ctx.lineTo(x,y0+Math.sin(x*l.freq+ph)*amp+Math.sin(x*l.freq*1.7+ph*1.3)*(amp*.4)+Math.sin(x*l.freq*.5+ph*.6)*(amp*.3));
        ctx.strokeStyle=`hsla(${l.hue},70%,${65+i*1.5}%,${l.alpha})`;ctx.lineWidth=l.lw;ctx.stroke();
      }
    });
    t+=1;requestAnimationFrame(draw);
  }
  draw();
}

// ═══════════════════════════════════════
// D3 MAP
// ═══════════════════════════════════════
function initMap(world){
  const wrapper=document.getElementById('map-wrapper');
  const W=wrapper.clientWidth,H=wrapper.clientHeight;
  svgSel=d3.select('#map-svg');svgSel.selectAll('*').remove();
  proj=d3.geoNaturalEarth1().scale(W/6.28).translate([W/2,H/2]);
  pathFn=d3.geoPath().projection(proj);
  zoomBehavior=d3.zoom().scaleExtent([.6,16]).on('zoom',ev=>{
    mainG.attr('transform',ev.transform);
    updateContLabels(ev.transform);
    const t=ev.transform;
    gPins.selectAll('.pin-group').each(function(){
      const el=d3.select(this);
      const cx=+el.attr('data-cx'),cy=+el.attr('data-cy');
      if(!isNaN(cx)) el.attr('transform','translate('+(cx*t.k+t.x)+','+(cy*t.k+t.y)+')');
    });
  });
  svgSel.call(zoomBehavior);

  // Native click
  const svgNode=document.getElementById('map-svg');
  let pdX=0,pdY=0;
  svgNode.addEventListener('pointerdown',e=>{pdX=e.clientX;pdY=e.clientY});
  svgNode.addEventListener('pointerup',e=>{
    if(Math.abs(e.clientX-pdX)>6||Math.abs(e.clientY-pdY)>6)return;
    const wRect=svgNode.getBoundingClientRect();
    const tr=d3.zoomTransform(svgNode);
    const sx=(e.clientX-wRect.left-tr.x)/tr.k;
    const sy=(e.clientY-wRect.top-tr.y)/tr.k;
    const feat=allFeatures.find(f=>{try{return d3.geoContains(f,proj.invert([sx,sy]))}catch{return false}});
    if(!feat)return;
    const name=getName(feat.id);if(!name)return;
    openCountry(String(parseInt(String(feat.id),10)),name);
  });

  mainG=svgSel.append('g');
  mainG.append('path').datum({type:'Sphere'}).attr('class','sphere').attr('d',pathFn);
  mainG.append('path').datum(d3.geoGraticule()()).attr('class','graticule').attr('d',pathFn);
  allFeatures=topojson.feature(world,world.objects.countries).features;
  gCountries=mainG.append('g');
  gCountries.selectAll('path.country').data(allFeatures).join('path')
    .attr('class','country').attr('d',pathFn).attr('fill',d=>getColor(d.id))
    .on('mouseenter',(e,d)=>{hideTT()}).on('mousemove',moveTT).on('mouseleave',hideTT);
  mainG.append('path').datum(topojson.mesh(world,world.objects.countries,(a,b)=>a!==b)).attr('class','borders').attr('d',pathFn);
  gPins=svgSel.append('g').attr('id','g-pins');

  // Continent labels
  const CONT_LABELS=[{name:'EUROPE',lon:15,lat:52},{name:'ASIE',lon:90,lat:45},{name:'AFRIQUE',lon:20,lat:5},{name:'AMÉRIQUES',lon:-80,lat:15},{name:'OCÉANIE',lon:135,lat:-25}];
  const gCont=svgSel.append('g').attr('id','g-continents').attr('pointer-events','none');
  CONT_LABELS.forEach(cl=>{
    const g=gCont.append('g').attr('data-lon',cl.lon).attr('data-lat',cl.lat);
    g.append('text').attr('text-anchor','middle').attr('dominant-baseline','central').style('font-family','Outfit,sans-serif').style('font-size','11px').style('font-weight','700').style('letter-spacing','0.12em').style('fill','rgba(0,0,0,0.5)').attr('dx',1).attr('dy',1).text(cl.name);
    g.append('text').attr('text-anchor','middle').attr('dominant-baseline','central').style('font-family','Outfit,sans-serif').style('font-size','11px').style('font-weight','700').style('letter-spacing','0.12em').style('fill','rgba(255,255,255,0.42)').text(cl.name);
  });
  function updateContLabels(transform){
    const k=transform.k;
    gCont.selectAll('g').each(function(){
      const lon=+d3.select(this).attr('data-lon'),lat=+d3.select(this).attr('data-lat');
      const[sx,sy]=proj([lon,lat]);
      d3.select(this).attr('transform',`translate(${sx*k+transform.x},${sy*k+transform.y})`);
    });
    gCont.style('opacity',k>3.5?Math.max(0,1-(k-3.5)/1.5):1);
  }
  window.updateContLabels=updateContLabels;
  updateContLabels(d3.zoomIdentity);
  refreshPins();
}


// Manual geographic centroids for countries with distorted computed centroids
const MANUAL_CENTROIDS = {
  250: [2.3, 46.2],    // France (métropolitaine)
  840: [-98.5, 39.5],  // États-Unis (continental)
  643: [95.0, 60.0],   // Russie
  578: [15.0, 65.0],   // Norvège (sans Svalbard)
  208: [10.0, 56.0],   // Danemark (sans Groenland)
  528: [5.3, 52.1],    // Pays-Bas
  304: [-42.0, 72.0],  // Groenland
  710: [25.0, -29.0],  // Afrique du Sud
  36:  [134.0, -25.0], // Australie
  554: [172.0, -41.0], // Nouvelle-Zélande
  76:  [-51.9, -14.2], // Brésil
};

function refreshPins(){
  if(!gPins)return;
  let total=0;
  gCountries&&gCountries.selectAll('path.country').classed('has-pins',d=>d&&getApprovedPins(d.id).length>0);
  gPins.selectAll('*').remove();
  for(const[id]of Object.entries(allPins)){ const sid=String(id);
    const approved=getApprovedPins(sid);
    if(!approved.length)continue;
    total+=approved.length;
    const numId=parseInt(sid,10);
    const feat=allFeatures.find(f=>String(f.id)===sid||+f.id===numId);if(!feat)continue;
    let cx,cy;
    if(MANUAL_CENTROIDS[numId]){
      [cx,cy]=proj(MANUAL_CENTROIDS[numId]);
    } else {
      [cx,cy]=pathFn.centroid(feat);
    }
    if(!isFinite(cx)||!isFinite(cy))continue;
    const n=approved.length,r=n>9?8:6.5;
    const _zt=d3.zoomTransform(svgSel.node());
    const _px=cx*_zt.k+_zt.x, _py=cy*_zt.k+_zt.y;
    const pg=gPins.append('g').attr('class','pin-group').attr('data-cx',cx).attr('data-cy',cy).attr('transform','translate('+_px+','+_py+')');
    pg.append('line').attr('x1',0).attr('y1',-(r+1)).attr('x2',0).attr('y2',2).attr('stroke','#22c55e').attr('stroke-width',1.3).attr('opacity',.7);
    pg.append('circle').attr('class','pin-c').attr('cx',0).attr('cy',-(r+5)).attr('r',r).attr('fill','#22c55e').attr('stroke','rgba(0,0,0,.3)').attr('stroke-width',.7);
    pg.append('text').attr('class','pin-lbl').attr('x',0).attr('y',-(r+5)).text(n>9?'9+':n);
    const name=getName(id);
    pg.on('mouseenter',e=>showTT(e,name,n)).on('mousemove',moveTT).on('mouseleave',hideTT);
  }
  document.getElementById('pin-count').textContent=total;
}

function zoomIn(){svgSel.transition().duration(300).call(zoomBehavior.scaleBy,1.6)}
function zoomOut(){svgSel.transition().duration(300).call(zoomBehavior.scaleBy,1/1.6)}
function zoomReset(){svgSel.transition().duration(420).call(zoomBehavior.transform,d3.zoomIdentity)}

async function boot(){
  initOcean();
  try{
    document.getElementById('loader-text').textContent='Chargement de la carte…';
    const world=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    initMap(world);
    const loader=document.getElementById('loader');
    loader.classList.add('done');
    setTimeout(()=>loader.style.display='none',600);
  }catch(err){
    console.error(err);
    document.getElementById('loader-text').textContent='⚠️ Erreur de chargement.';
  }
}
document.getElementById('pseudo-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
boot();
